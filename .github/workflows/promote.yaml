# reusable workflow triggered manually
name: Promote charm to other tracks and channels

on:
  workflow_dispatch:
    inputs:
      destination-channel:
        description: 'Destination Channel'
        required: true
      origin-channel:
        description: 'Origin Channel'
        required: true
      charm-name:
        description: 'Charm Name'
        default: 'pvcviewer-operator'
        required: true

jobs:
  promote-charm:
    name: Promote charm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Promote charm
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_CREDENTIALS }}
        run: |
          charmcraft promote --name ${{ github.event.inputs.charm-name }} \
            --from ${{ github.event.inputs.origin-channel }} \
            --to ${{ github.event.inputs.destination-channel }}
